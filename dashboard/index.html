<script type="text/babel">
const { useState, useEffect } = React;

const API_URL = "https://kmiaus64cj.execute-api.us-east-1.amazonaws.com/default/Pavan__2506";
// API Gateway usage-plan key. This throttles/limits and lets you monitor or
// revoke access to the endpoint - it is NOT a secret (anyone viewing this
// page's source can read it), so it stops casual abuse/cost overruns but is
// not a substitute for real user auth (e.g. Cognito) on a production system.
const API_KEY = "4bipB02aZxAL0LULF_r9VvRxuYXoMyznPqbVomkZdpY";
const API_HEADERS = { "x-api-key": API_KEY };

// The backend now returns short error *categories* instead of raw
// exception text (so internal details never leak to the browser). Map
// those categories to something a person can actually read.
const ERROR_MESSAGES = {
  summary_unavailable: "Couldn't generate a summary right now — the AI service or database may be temporarily unavailable.",
  query_failed: "That query didn't complete in time.",
  all_queries_failed: "The database didn't respond in time. It may be cold-starting after being idle — try again in a moment.",
  unknown_dataset: "That dataset isn't available.",
  processing_failed: "Something went wrong while analyzing this document. Please try again.",
  unauthorized: "This request wasn't authorized. Double-check the API key is set correctly.",
  missing_fields: "Please choose a file before uploading.",
  invalid_file_data: "That file couldn't be read. Please try a different file.",
  file_too_large: "That file is too large (8MB max). Please try a smaller file.",
  upload_failed: "Upload failed. Please try again.",
  check_failed: "Couldn't check the processing status. Please try again.",
};
function friendlyError(message) {
  return ERROR_MESSAGES[message] || message || "Something went wrong.";
}

const INK = "#1c2333";
const PAPER = "#f6f3ea";
const RULE = "#d8d2c0";
const STAMP = "#a83232";
const SEAL = "#2f5d50";
const GOLD = "#b08a3e";
const MUTE = "#6b6455";

const COMPANY_COLORS = [SEAL, GOLD, STAMP, "#5b6a8f", "#7a8471", "#9c7a4a", "#4a5568", "#8a5a44"];

function Card({ title, eyebrow, children, wide }) {
  return (
    <div style={{
      background: PAPER,
      border: `1px solid ${RULE}`,
      borderRadius: 2,
      padding: "20px 22px 22px",
      gridColumn: wide ? "1 / -1" : undefined,
    }}>
      <div style={{
        fontFamily: "'Courier New', monospace",
        fontSize: 10.5,
        letterSpacing: "0.14em",
        color: STAMP,
        textTransform: "uppercase",
        marginBottom: 4,
      }}>{eyebrow}</div>
      <h3 style={{
        fontFamily: "Georgia, 'Times New Roman', serif",
        fontSize: 18,
        fontWeight: 700,
        color: INK,
        margin: "0 0 16px",
        borderBottom: `2px solid ${INK}`,
        paddingBottom: 10,
      }}>{title}</h3>
      {children}
    </div>
  );
}

const fmt = (n) => (typeof n === "number" ? n.toLocaleString() : n);

function wrapLabel(text, maxCharsPerLine = 16, maxLines = 3) {
  const words = String(text).split(" ");
  const lines = [];
  let current = "";
  words.forEach((word) => {
    if ((current + " " + word).trim().length > maxCharsPerLine) {
      if (current) lines.push(current.trim());
      current = word;
    } else {
      current = (current + " " + word).trim();
    }
  });
  if (current) lines.push(current);
  return lines.slice(0, maxLines);
}

function HBarChart({ data, labelKey, valueKey, colors, height }) {
  if (!data || !data.length) return null;
  const max = Math.max(...data.map((d) => d[valueKey]));
  const labelW = 190;
  const lineH = 12;
  const wrapped = data.map((d) => wrapLabel(d[labelKey], 22, 2));
  const rowHeights = wrapped.map((lines) => Math.max(34, lines.length * lineH + 14));
  const totalH = rowHeights.reduce((a, b) => a + b, 0);
  const finalHeight = height || totalH;
  let cursorY = 0;
  const rows = data.map((d, i) => {
    const rowH = rowHeights[i];
    const y = cursorY;
    cursorY += rowH;
    const barMaxW = 560 - labelW - 50;
    const w = max ? (d[valueKey] / max) * barMaxW : 0;
    const lines = wrapped[i];
    const textCenterY = y + rowH / 2;
    const firstLineY = textCenterY - ((lines.length - 1) * lineH) / 2 + 4;
    return (
      <g key={i}>
        <text x={labelW - 8} y={firstLineY} textAnchor="end" fontSize="11" fill={INK}>
          {lines.map((line, li) => (
            <tspan key={li} x={labelW - 8} dy={li === 0 ? 0 : lineH}>{line}</tspan>
          ))}
        </text>
        <rect x={labelW} y={y + rowH * 0.22} width={w} height={rowH * 0.56} fill={colors ? colors[i % colors.length] : SEAL} rx="2">
          <title>{d[labelKey]}: {fmt(d[valueKey])}</title>
        </rect>
        <text x={labelW + w + 8} y={textCenterY + 4} fontSize="11" fill={MUTE}>
          {fmt(d[valueKey])}
        </text>
      </g>
    );
  });
  return (
    <svg width="100%" viewBox={`0 0 560 ${finalHeight}`} style={{ fontFamily: "'Courier New', monospace" }}>
      {rows}
    </svg>
  );
}

function VBarChart({ data, labelKey, valueKey, color = GOLD, height = 300 }) {
  if (!data || !data.length) return null;
  const max = Math.max(...data.map((d) => d[valueKey]));
  const width = 900;
  const chartH = height - 140;
  const colW = width / data.length;
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} style={{ fontFamily: "'Courier New', monospace" }}>
      <line x1="0" y1={chartH} x2={width} y2={chartH} stroke={RULE} />
      {data.map((d, i) => {
        const h = max ? (d[valueKey] / max) * (chartH - 10) : 0;
        const x = i * colW + colW * 0.15;
        const barW = colW * 0.7;
        const y = chartH - h;
        const lines = wrapLabel(d[labelKey], 14, 3);
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={h} fill={color} rx="2">
              <title>{d[labelKey]}: {fmt(d[valueKey])}</title>
            </rect>
            <text x={x + barW / 2} y={chartH + 16} fontSize="10" fill={INK} textAnchor="middle">
              {lines.map((line, li) => (
                <tspan key={li} x={x + barW / 2} dy={li === 0 ? 0 : 12}>{line}</tspan>
              ))}
            </text>
            <text x={x + barW / 2} y={y - 6} fontSize="10" fill={MUTE} textAnchor="middle">
              {fmt(d[valueKey])}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function Donut({ data, labelKey, valueKey, colorFor, size = 220 }) {
  if (!data || !data.length) return null;
  const total = data.reduce((a, d) => a + d[valueKey], 0);
  const r = size / 2 - 10;
  const cx = size / 2;
  const cy = size / 2;
  let angle = -90;
  const arcs = data.map((d) => {
    const frac = total ? d[valueKey] / total : 0;
    const start = angle;
    const sweep = frac * 360;
    angle += sweep;
    const end = angle;
    const large = sweep > 180 ? 1 : 0;
    const toXY = (a) => {
      const rad = (a * Math.PI) / 180;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    };
    const [x1, y1] = toXY(start);
    const [x2, y2] = toXY(end);
    return {
      d: `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`,
      fill: colorFor(d),
      label: d[labelKey],
      value: d[valueKey],
    };
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {arcs.map((a, i) => (
        <path key={i} d={a.d} fill={a.fill}>
          <title>{a.label}: {fmt(a.value)}</title>
        </path>
      ))}
      <circle cx={cx} cy={cy} r={r * 0.55} fill={PAPER} />
    </svg>
  );
}

function LineChartSVG({ data, labelKey, valueKey, color = SEAL, height = 200 }) {
  if (!data || !data.length) return null;
  const width = 900;
  const padL = 40, padB = 24, padT = 10;
  const max = Math.max(...data.map((d) => d[valueKey]));
  const min = 0;
  const chartH = height - padB - padT;
  const stepX = data.length > 1 ? (width - padL - 20) / (data.length - 1) : 0;
  const points = data.map((d, i) => {
    const x = padL + i * stepX;
    const y = padT + chartH - (max ? ((d[valueKey] - min) / (max - min)) * chartH : 0);
    return [x, y];
  });
  const path = points.map((p, i) => (i === 0 ? `M ${p[0]} ${p[1]}` : `L ${p[0]} ${p[1]}`)).join(" ");
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} style={{ fontFamily: "'Courier New', monospace" }}>
      <line x1={padL} y1={padT + chartH} x2={width} y2={padT + chartH} stroke={RULE} />
      <line x1={padL} y1={padT} x2={padL} y2={padT + chartH} stroke={RULE} />
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" />
      {points.map(([x, y], i) => (
        <g key={i}>
          <circle cx={x} cy={y} r="4" fill={color}>
            <title>{data[i][labelKey]}: {fmt(data[i][valueKey])}</title>
          </circle>
          <text x={x} y={height - 6} fontSize="10" fill={MUTE} textAnchor="middle">{data[i][labelKey]}</text>
        </g>
      ))}
    </svg>
  );
}

function CompanySummary() {
  const [company, setCompany] = useState("");
  const [summary, setSummary] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);

  const runSummary = () => {
    if (!company.trim()) return;
    setLoading(true);
    setErr(null);
    setSummary(null);
    fetch(API_URL + "?company=" + encodeURIComponent(company.trim()), { headers: API_HEADERS })
      .then((r) => r.json())
      .then((json) => {
        if (json.error) throw new Error(json.error);
        setSummary(json.summary);
        setLoading(false);
      })
      .catch((e) => {
        setErr(e.message || "Failed to generate summary");
        setLoading(false);
      });
  };

  return (
    <Card eyebrow="Exhibit F — AI Deposition (Amazon Bedrock)" title="Ask about a company" wide>
      <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
        <input
          type="text"
          value={company}
          onChange={(e) => setCompany(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && runSummary()}
          placeholder="e.g. EQUIFAX, INC."
          style={{
            flex: 1,
            minWidth: 220,
            padding: "10px 12px",
            fontFamily: "'Courier New', monospace",
            fontSize: 13,
            border: `1px solid ${RULE}`,
            borderRadius: 2,
            background: "#fff",
          }}
        />
        <button
          onClick={runSummary}
          disabled={loading}
          style={{
            padding: "10px 20px",
            fontFamily: "'Courier New', monospace",
            fontSize: 12,
            letterSpacing: "0.08em",
            textTransform: "uppercase",
            background: INK,
            color: PAPER,
            border: "none",
            borderRadius: 2,
            cursor: loading ? "default" : "pointer",
            opacity: loading ? 0.6 : 1,
          }}
        >
          {loading ? "Drafting…" : "Summarize"}
        </button>
      </div>

      {err && (
        <div style={{ fontSize: 13, color: STAMP, fontFamily: "'Courier New', monospace" }}>
          RECORD UNAVAILABLE — {friendlyError(err)}
        </div>
      )}

      {summary && (
        <div style={{
          fontFamily: "Georgia, 'Times New Roman', serif",
          fontSize: 15,
          lineHeight: 1.6,
          color: INK,
          borderLeft: `3px solid ${GOLD}`,
          paddingLeft: 16,
        }}>
          {summary}
        </div>
      )}

      {!summary && !err && !loading && (
        <div style={{ fontSize: 12, color: "#8a8371", fontFamily: "'Courier New', monospace" }}>
          Type a company name exactly as filed (e.g. "EQUIFAX, INC.") and generate a live summary from Amazon Bedrock.
        </div>
      )}
    </Card>
  );
}

function DocumentUpload() {
  const [file, setFile] = useState(null);
  const [status, setStatus] = useState("idle");
  const [result, setResult] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");
  const [fileName, setFileName] = useState("");

  const resetState = () => {
    setStatus("idle");
    setResult(null);
    setErrorMsg("");
  };

  const handleFileChange = (e) => {
    const f = e.target.files[0];
    if (f) {
      setFile(f);
      setFileName(f.name);
      resetState();
    }
  };

  const pollForResult = (filename, attemptsLeft) => {
    if (attemptsLeft <= 0) {
      setStatus("error");
      setErrorMsg("Processing is taking longer than expected. Please try again shortly.");
      return;
    }
    fetch(API_URL + "?check=" + encodeURIComponent(filename), { headers: API_HEADERS })
      .then((r) => r.json())
      .then((json) => {
        if (json.status === "ready") {
          setResult(json.result);
          setStatus("ready");
        } else {
          setTimeout(() => pollForResult(filename, attemptsLeft - 1), 3000);
        }
      })
      .catch(() => {
        setTimeout(() => pollForResult(filename, attemptsLeft - 1), 3000);
      });
  };

  const handleUpload = () => {
    if (!file) return;
    setStatus("uploading");
    setErrorMsg("");

    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(",")[1];
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...API_HEADERS },
        body: JSON.stringify({ filename: file.name, file_base64: base64 }),
      })
        .then((r) => r.json())
        .then((json) => {
          if (json.error) throw new Error(json.error);
          setStatus("processing");
          pollForResult(file.name, 15);
        })
        .catch((e) => {
          setStatus("error");
          setErrorMsg(e.message || "Upload failed");
        });
    };
    reader.onerror = () => {
      setStatus("error");
      setErrorMsg("Could not read the selected file");
    };
    reader.readAsDataURL(file);
  };

  const sentimentColor = (s) => {
    if (s === "NEGATIVE") return STAMP;
    if (s === "POSITIVE") return SEAL;
    if (s === "MIXED") return GOLD;
    return "#8b8f9c";
  };

  return (
    <Card eyebrow="Exhibit G — Document Intelligence (Amazon Textract)" title="Analyze a complaint document" wide>
      <div style={{ fontSize: 12, color: "#8a8371", fontFamily: "'Courier New', monospace", marginBottom: 14 }}>
        Upload a scanned complaint letter, screenshot, or PDF. The system extracts the text,
        scores its sentiment, and generates an AI summary.
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap", alignItems: "center" }}>
        <label style={{
          padding: "10px 16px",
          fontFamily: "'Courier New', monospace",
          fontSize: 12,
          border: `1px solid ${RULE}`,
          borderRadius: 2,
          background: "#fff",
          cursor: "pointer",
        }}>
          {fileName || "Choose file…"}
          <input
            type="file"
            accept="image/*,.pdf"
            onChange={handleFileChange}
            style={{ display: "none" }}
          />
        </label>
        <button
          onClick={handleUpload}
          disabled={!file || status === "uploading" || status === "processing"}
          style={{
            padding: "10px 20px",
            fontFamily: "'Courier New', monospace",
            fontSize: 12,
            letterSpacing: "0.08em",
            textTransform: "uppercase",
            background: INK,
            color: PAPER,
            border: "none",
            borderRadius: 2,
            cursor: (!file || status === "uploading" || status === "processing") ? "default" : "pointer",
            opacity: (!file || status === "uploading" || status === "processing") ? 0.6 : 1,
          }}
        >
          {status === "uploading" ? "Uploading…" : status === "processing" ? "Analyzing…" : "Upload & Analyze"}
        </button>
      </div>

      {status === "error" && (
        <div style={{ fontSize: 13, color: STAMP, fontFamily: "'Courier New', monospace" }}>
          RECORD UNAVAILABLE — {friendlyError(errorMsg)}
        </div>
      )}

      {status === "processing" && (
        <div style={{ fontSize: 12, color: "#8a8371", fontFamily: "'Courier New', monospace" }}>
          Extracting text and running analysis — this can take up to 30 seconds…
        </div>
      )}

      {status === "ready" && result && !result.error && (
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
            <span style={{
              fontFamily: "'Courier New', monospace",
              fontSize: 11,
              letterSpacing: "0.08em",
              textTransform: "uppercase",
              color: "#fff",
              background: sentimentColor(result.sentiment),
              padding: "4px 10px",
              borderRadius: 2,
            }}>
              {result.sentiment}
            </span>
            <span style={{ fontSize: 11, color: MUTE, fontFamily: "'Courier New', monospace" }}>
              {result.filename}
            </span>
          </div>

          <div style={{
            fontFamily: "Georgia, 'Times New Roman', serif",
            fontSize: 15,
            lineHeight: 1.6,
            color: INK,
            borderLeft: `3px solid ${GOLD}`,
            paddingLeft: 16,
            marginBottom: 16,
          }}>
            {result.summary}
          </div>

          <details>
            <summary style={{
              cursor: "pointer",
              fontFamily: "'Courier New', monospace",
              fontSize: 11,
              letterSpacing: "0.08em",
              textTransform: "uppercase",
              color: MUTE,
            }}>
              View extracted text
            </summary>
            <pre style={{
              whiteSpace: "pre-wrap",
              fontFamily: "'Courier New', monospace",
              fontSize: 12,
              color: INK,
              background: "#fff",
              border: `1px solid ${RULE}`,
              padding: 12,
              marginTop: 8,
              maxHeight: 240,
              overflow: "auto",
            }}>
              {result.extracted_text}
            </pre>
          </details>
        </div>
      )}

      {status === "ready" && result && result.error && (
        <div style={{ fontSize: 13, color: STAMP, fontFamily: "'Courier New', monospace" }}>
          RECORD UNAVAILABLE — {friendlyError(result.error)}
        </div>
      )}
    </Card>
  );
}

function ComplaintsDashboard() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(true);
  const [now] = useState(() => new Date());
  // Pagination state for "load more" on the two ranked charts. Each entry
  // tracks how many rows we've fetched so far and whether we've hit the
  // end (server returned fewer rows than we asked for).
  const [pages, setPages] = useState({
    top_companies: { offset: 8, loadingMore: false, done: false },
    top_issues: { offset: 8, loadingMore: false, done: false },
  });

  useEffect(() => {
    fetch(API_URL, { headers: API_HEADERS })
      .then((r) => r.json())
      .then((json) => {
        if (json.error) throw new Error(typeof json.error === "string" ? json.error : "Query error");
        setData(json.data || json);
        setLoading(false);
      })
      .catch((e) => {
        setError(e.message || "Failed to load");
        setLoading(false);
      });
  }, []);

  const loadMore = (name) => {
    const page = pages[name];
    if (!page || page.loadingMore || page.done) return;
    setPages((p) => ({ ...p, [name]: { ...page, loadingMore: true } }));

    fetch(API_URL + "?more=" + encodeURIComponent(name) + "&offset=" + page.offset, { headers: API_HEADERS })
      .then((r) => r.json())
      .then((json) => {
        if (json.error) throw new Error(typeof json.error === "string" ? json.error : "Query error");
        const rows = json.rows || [];
        setData((d) => ({ ...d, [name]: [...(d[name] || []), ...rows] }));
        setPages((p) => ({
          ...p,
          [name]: {
            offset: page.offset + rows.length,
            loadingMore: false,
            done: rows.length < (json.limit || 8),
          },
        }));
      })
      .catch(() => {
        setPages((p) => ({ ...p, [name]: { ...page, loadingMore: false } }));
      });
  };

  return (
    <div style={{
      minHeight: "100vh",
      background: INK,
      backgroundImage:
        "radial-gradient(circle at 20% 0%, #262f45 0%, transparent 45%), radial-gradient(circle at 90% 10%, #24352f 0%, transparent 40%)",
      fontFamily: "Georgia, 'Times New Roman', serif",
      padding: "36px 28px 60px",
    }}>
      <div style={{ maxWidth: 1180, margin: "0 auto 32px" }}>
        <div style={{
          display: "flex",
          justifyContent: "space-between",
          alignItems: "flex-end",
          borderBottom: `3px double ${GOLD}`,
          paddingBottom: 16,
          flexWrap: "wrap",
          gap: 12,
        }}>
          <div>
            <div style={{
              fontFamily: "'Courier New', monospace",
              fontSize: 11,
              letterSpacing: "0.2em",
              color: GOLD,
              textTransform: "uppercase",
              marginBottom: 6,
            }}>
              Docket No. CFPB-2026 · Public Record
            </div>
            <h1 style={{
              color: PAPER,
              fontSize: "clamp(26px, 4vw, 38px)",
              fontWeight: 700,
              margin: 0,
              letterSpacing: "-0.01em",
            }}>
              Consumer Complaint Register
            </h1>
            <div style={{ color: "#9099b3", fontSize: 13.5, marginTop: 6, fontStyle: "italic" }}>
              A live reading of the CFPB complaint database, compiled from Redshift Serverless
            </div>
          </div>
          <div style={{
            fontFamily: "'Courier New', monospace",
            fontSize: 11,
            color: "#7a8299",
            textAlign: "right",
          }}>
            Compiled {now.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })}
            <br />
            Source: files.consumerfinance.gov
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 1180, margin: "0 auto" }}>
        {loading && (
          <div style={{ color: PAPER, fontFamily: "'Courier New', monospace", padding: 40, textAlign: "center" }}>
            Retrieving records from the register…
          </div>
        )}

        {error && (
          <div style={{
            background: "#3a1f22",
            border: `1px solid ${STAMP}`,
            color: "#f2c9c9",
            padding: 20,
            fontFamily: "'Courier New', monospace",
            fontSize: 13,
          }}>
            <strong style={{ color: STAMP }}>RECORD UNAVAILABLE —</strong> {friendlyError(error)}
          </div>
        )}

        {data && (
          <React.Fragment>
            <div style={{
              display: "grid",
              gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))",
              gap: 1,
              background: RULE,
              marginBottom: 28,
              border: `1px solid ${RULE}`,
            }}>
              {[
                ["Total complaints", data.summary_stats && data.summary_stats[0] && data.summary_stats[0].total_complaints],
                ["Companies named", data.summary_stats && data.summary_stats[0] && data.summary_stats[0].unique_companies],
                ["States represented", data.summary_stats && data.summary_stats[0] && data.summary_stats[0].states_represented],
                ["Resolved on time", (() => {
                  const rt = data.response_timeliness || [];
                  const yes = (rt.find((r) => r.timely_response === "Yes") || {}).count || 0;
                  const total = rt.reduce((a, r) => a + r.count, 0);
                  return total ? Math.round((yes / total) * 100) + "%" : "—";
                })()],
              ].map(([label, value]) => (
                <div key={label} style={{ background: PAPER, padding: "18px 20px" }}>
                  <div style={{
                    fontFamily: "'Courier New', monospace",
                    fontSize: 10,
                    letterSpacing: "0.1em",
                    textTransform: "uppercase",
                    color: MUTE,
                  }}>{label}</div>
                  <div style={{ fontSize: 30, fontWeight: 700, color: INK, marginTop: 4 }}>{fmt(value)}</div>
                </div>
              ))}
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 20 }}>
              <Card eyebrow="Exhibit A — By Respondent" title="Most-Named Companies">
                <HBarChart data={data.top_companies} labelKey="company" valueKey="complaint_count" colors={COMPANY_COLORS} />
                {!pages.top_companies.done && (
                  <button
                    onClick={() => loadMore("top_companies")}
                    disabled={pages.top_companies.loadingMore}
                    style={{
                      marginTop: 10,
                      fontFamily: "'Courier New', monospace",
                      fontSize: 11,
                      letterSpacing: "0.06em",
                      textTransform: "uppercase",
                      background: "transparent",
                      color: MUTE,
                      border: `1px solid ${RULE}`,
                      borderRadius: 2,
                      padding: "6px 12px",
                      cursor: pages.top_companies.loadingMore ? "default" : "pointer",
                    }}
                  >
                    {pages.top_companies.loadingMore ? "Loading…" : "Load more"}
                  </button>
                )}
              </Card>

              <Card eyebrow="Exhibit B — By Nature" title="Disposition Timeliness">
                <div style={{ display: "flex", justifyContent: "center", padding: "10px 0" }}>
                  <Donut
                    data={data.response_timeliness}
                    labelKey="timely_response"
                    valueKey="count"
                    colorFor={(d) => (d.timely_response === "Yes" ? SEAL : STAMP)}
                  />
                </div>
                <div style={{ display: "flex", justifyContent: "center", gap: 20, fontSize: 12, fontFamily: "'Courier New', monospace" }}>
                  {data.response_timeliness && data.response_timeliness.map((r, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ width: 10, height: 10, background: r.timely_response === "Yes" ? SEAL : STAMP, display: "inline-block" }} />
                      {r.timely_response === "Yes" ? "Timely" : "Untimely"} — {fmt(r.count)}
                    </div>
                  ))}
                </div>
              </Card>

              <Card eyebrow="Exhibit C — By Allegation" title="Leading Issues Filed" wide>
                <VBarChart data={data.top_issues} labelKey="issue" valueKey="issue_count" color={GOLD} />
                {!pages.top_issues.done && (
                  <button
                    onClick={() => loadMore("top_issues")}
                    disabled={pages.top_issues.loadingMore}
                    style={{
                      marginTop: 10,
                      fontFamily: "'Courier New', monospace",
                      fontSize: 11,
                      letterSpacing: "0.06em",
                      textTransform: "uppercase",
                      background: "transparent",
                      color: MUTE,
                      border: `1px solid ${RULE}`,
                      borderRadius: 2,
                      padding: "6px 12px",
                      cursor: pages.top_issues.loadingMore ? "default" : "pointer",
                    }}
                  >
                    {pages.top_issues.loadingMore ? "Loading…" : "Load more"}
                  </button>
                )}
              </Card>

              <Card eyebrow="Exhibit D — By Filing Date" title="Complaints Over Time" wide>
                <LineChartSVG data={data.monthly_trend} labelKey="month" valueKey="complaints" color={SEAL} />
                <div style={{ fontSize: 11, color: "#8a8371", fontFamily: "'Courier New', monospace", marginTop: 4 }}>
                  Note: filing dates reflect the sampled extract, not full database coverage.
                </div>
              </Card>

              <Card eyebrow="Exhibit E — By Tone (Amazon Comprehend)" title="Narrative Sentiment">
                <HBarChart
                  data={data.sentiment_breakdown}
                  labelKey="sentiment"
                  valueKey="count"
                  colors={data.sentiment_breakdown && data.sentiment_breakdown.map(d => {
                    if (d.sentiment === "NEGATIVE") return STAMP;
                    if (d.sentiment === "POSITIVE") return SEAL;
                    if (d.sentiment === "MIXED") return GOLD;
                    return "#8b8f9c";
                  })}
                  height={180}
                />
                <div style={{ fontSize: 11, color: "#8a8371", fontFamily: "'Courier New', monospace", marginTop: 8 }}>
                  NLP sentiment scoring on a 500-narrative sample, via Amazon Comprehend.
                </div>
              </Card>

              <CompanySummary />
              <DocumentUpload />
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ComplaintsDashboard />);
</script>
</body>
</html>
